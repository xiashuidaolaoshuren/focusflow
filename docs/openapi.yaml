components:
  schemas:
    CommitmentRequest:
      properties:
        commitmentDate:
          format: "date"
          type: "string"
        endTime:
          example: "14:30:00"
          type: "string"
        startTime:
          example: "14:30:00"
          type: "string"
        title:
          maxLength: 255
          minLength: 0
          type: "string"
      required:
      - "commitmentDate"
      - "endTime"
      - "startTime"
      type: "object"
    CommitmentResponse:
      properties:
        commitmentDate:
          format: "date"
          type: "string"
        endTime:
          example: "14:30:00"
          type: "string"
        id:
          format: "int64"
          type: "integer"
        startTime:
          example: "14:30:00"
          type: "string"
        title:
          type: "string"
      type: "object"
    CreateTaskRequest:
      properties:
        description:
          type: "string"
        dueDate:
          format: "date"
          type: "string"
        estimatedMinutes:
          format: "int32"
          type: "integer"
        priority:
          enum:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          type: "string"
        title:
          minLength: 1
          type: "string"
      type: "object"
    DailyPlanResponse:
      properties:
        blocks:
          items:
            $ref: "#/components/schemas/ScheduledBlockResponse"
          type: "array"
        createdAt:
          format: "date-time"
          type: "string"
        freeMinutes:
          format: "int32"
          type: "integer"
        id:
          format: "int64"
          type: "integer"
        peakEnd:
          example: "14:30:00"
          type: "string"
        peakStart:
          example: "14:30:00"
          type: "string"
        planDate:
          format: "date"
          type: "string"
        realizedBufferMinutes:
          format: "int32"
          type: "integer"
        requestedBufferMinutes:
          format: "int32"
          type: "integer"
        requiredMinutes:
          format: "int64"
          type: "integer"
        scheduledWorkMinutes:
          format: "int32"
          type: "integer"
        unplacedWork:
          items:
            $ref: "#/components/schemas/UnplacedWorkResponse"
          type: "array"
        warning:
          $ref: "#/components/schemas/DailyPlanWarning"
        windowEnd:
          example: "14:30:00"
          type: "string"
        windowStart:
          example: "14:30:00"
          type: "string"
      type: "object"
    DailyPlanSummaryResponse:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        hasWarning:
          type: "boolean"
        id:
          format: "int64"
          type: "integer"
        planDate:
          format: "date"
          type: "string"
        scheduledTaskCount:
          format: "int32"
          type: "integer"
        scheduledWorkMinutes:
          format: "int32"
          type: "integer"
        unplacedWorkCount:
          format: "int32"
          type: "integer"
        workSessionCount:
          format: "int32"
          type: "integer"
      type: "object"
    DailyPlanWarning:
      properties:
        freeMinutes:
          format: "int32"
          type: "integer"
        outOfTimeTasks:
          items:
            $ref: "#/components/schemas/OutOfTimeTask"
          type: "array"
        requiredMinutes:
          format: "int64"
          type: "integer"
        scheduledWorkMinutes:
          format: "int32"
          type: "integer"
        unestimatedTasks:
          items:
            $ref: "#/components/schemas/UnestimatedTask"
          type: "array"
      type: "object"
    FixedBreakRequest:
      properties:
        endTime:
          example: "14:30:00"
          type: "string"
        label:
          maxLength: 255
          minLength: 0
          type: "string"
        startTime:
          example: "14:30:00"
          type: "string"
      required:
      - "endTime"
      - "startTime"
      type: "object"
    FixedBreakResponse:
      properties:
        endTime:
          example: "14:30:00"
          type: "string"
        label:
          type: "string"
        startTime:
          example: "14:30:00"
          type: "string"
      type: "object"
    GeneratePlanRequest:
      properties:
        availableMinutes:
          format: "int32"
          minimum: 1
          type: "integer"
        planDate:
          format: "date"
          type: "string"
        replacePlanId:
          format: "int64"
          type: "integer"
      required:
      - "availableMinutes"
      - "planDate"
      type: "object"
    LoginRequest:
      properties:
        password:
          minLength: 1
          type: "string"
        username:
          minLength: 1
          type: "string"
      type: "object"
    OutOfTimeTask:
      properties:
        sourceTaskId:
          format: "int64"
          type: "integer"
        title:
          type: "string"
        unplacedMinutes:
          format: "int32"
          type: "integer"
      type: "object"
    PageResponseDailyPlanSummaryResponse:
      properties:
        content:
          items:
            $ref: "#/components/schemas/DailyPlanSummaryResponse"
          type: "array"
        page:
          format: "int32"
          type: "integer"
        size:
          format: "int32"
          type: "integer"
        totalElements:
          format: "int64"
          type: "integer"
        totalPages:
          format: "int32"
          type: "integer"
      type: "object"
    RegisterRequest:
      properties:
        email:
          minLength: 1
          type: "string"
        password:
          maxLength: 2147483647
          minLength: 8
          type: "string"
        username:
          maxLength: 30
          minLength: 3
          type: "string"
      type: "object"
    ScheduledBlockResponse:
      properties:
        endTime:
          example: "14:30:00"
          type: "string"
        kind:
          enum:
          - "WORK"
          - "CADENCE_BREAK"
          - "FIXED_BREAK"
          - "COMMITMENT"
          - "BUFFER"
          type: "string"
        label:
          type: "string"
        sessionCount:
          format: "int32"
          type: "integer"
        sessionIndex:
          format: "int32"
          type: "integer"
        startTime:
          example: "14:30:00"
          type: "string"
        taskSnapshot:
