      type: "object"
    SchedulingPreferencesRequest:
      properties:
        breakMinutes:
          format: "int32"
          minimum: 0
          type: "integer"
        bufferMinutes:
          format: "int32"
          minimum: 0
          type: "integer"
        cadenceEnabled:
          type: "boolean"
        fixedBreaks:
          items:
            $ref: "#/components/schemas/FixedBreakRequest"
          type: "array"
        minSessionMinutes:
          format: "int32"
          minimum: 1
          type: "integer"
        peakEnd:
          example: "14:30:00"
          type: "string"
        peakStart:
          example: "14:30:00"
          type: "string"
        targetFocusMinutes:
          format: "int32"
          minimum: 0
          type: "integer"
        workDayEnd:
          example: "14:30:00"
          type: "string"
        workDayStart:
          example: "14:30:00"
          type: "string"
      required:
      - "breakMinutes"
      - "bufferMinutes"
      - "cadenceEnabled"
      - "minSessionMinutes"
      - "targetFocusMinutes"
      - "workDayEnd"
      - "workDayStart"
      type: "object"
    SchedulingPreferencesResponse:
      properties:
        breakMinutes:
          format: "int32"
          type: "integer"
        bufferMinutes:
          format: "int32"
          type: "integer"
        cadenceEnabled:
          type: "boolean"
        fixedBreaks:
          items:
            $ref: "#/components/schemas/FixedBreakResponse"
          type: "array"
        minSessionMinutes:
          format: "int32"
          type: "integer"
        peakEnd:
          example: "14:30:00"
          type: "string"
        peakStart:
          example: "14:30:00"
          type: "string"
        persisted:
          type: "boolean"
        targetFocusMinutes:
          format: "int32"
          type: "integer"
        workDayEnd:
          example: "14:30:00"
          type: "string"
        workDayStart:
          example: "14:30:00"
          type: "string"
      type: "object"
    TaskResponse:
      properties:
        description:
          type: "string"
        dueDate:
          format: "date"
          type: "string"
        estimatedMinutes:
          format: "int32"
          type: "integer"
        id:
          format: "int64"
          type: "integer"
        priority:
          enum:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          type: "string"
        status:
          enum:
          - "OPEN"
          - "IN_PROGRESS"
          - "DONE"
          - "CANCELLED"
          type: "string"
        title:
          type: "string"
      type: "object"
    TaskSnapshotResponse:
      properties:
        dueDate:
          format: "date"
          type: "string"
        estimatedMinutes:
          format: "int32"
          type: "integer"
        mustInclude:
          type: "boolean"
        priority:
          enum:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          type: "string"
        sourceTaskId:
          format: "int64"
          type: "integer"
        status:
          enum:
          - "OPEN"
          - "IN_PROGRESS"
          - "DONE"
          - "CANCELLED"
          type: "string"
        taskReferenceId:
          format: "int64"
          type: "integer"
        title:
          type: "string"
      type: "object"
    UnestimatedTask:
      properties:
        sourceTaskId:
          format: "int64"
          type: "integer"
        title:
          type: "string"
      type: "object"
    UnplacedWorkResponse:
      properties:
        reason:
          enum:
          - "NO_ESTIMATE"
          - "OUT_OF_TIME"
          type: "string"
        taskSnapshot:
          $ref: "#/components/schemas/TaskSnapshotResponse"
        unplacedMinutes:
          format: "int32"
          type: "integer"
      type: "object"
    UpdateTaskRequest:
      properties:
        description:
          type: "string"
        dueDate:
          format: "date"
          type: "string"
        estimatedMinutes:
          format: "int32"
          type: "integer"
        priority:
          enum:
          - "LOW"
          - "MEDIUM"
          - "HIGH"
          type: "string"
        status:
          enum:
          - "OPEN"
          - "IN_PROGRESS"
          - "DONE"
          - "CANCELLED"
          type: "string"
        title:
          minLength: 1
          type: "string"
      type: "object"
    UserResponse:
      properties:
        email:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        username:
          type: "string"
      type: "object"
    ValidationDto:
      properties:
        name:
          minLength: 1
          type: "string"
      type: "object"
