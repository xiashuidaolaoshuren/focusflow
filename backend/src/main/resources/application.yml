spring:
  application:
    name: focusflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/focusflow}
    username: ${SPRING_DATASOURCE_USERNAME:focusflow}
    password: ${SPRING_DATASOURCE_PASSWORD:focusflow}
  flyway:
    baseline-on-migrate: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # LocalTime and LocalDate are wall-clock values (ADR 0009). The JDBC time
        # zone above is for instants; without direct binding it also shifts TIME columns.
        type:
          java_time_use_direct_jdbc: true

focusflow:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    connect-timeout: 2s
    read-timeout: 30s
    max-attempts: 2
    retry-delay: 1s
    max-retry-after: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
