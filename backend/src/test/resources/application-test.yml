# Test profile: full-context @SpringBootTest classes import PostgresTestcontainerConfig
# (Docker required). Flyway migrates V1 and V2 at context start; Hibernate validates the schema.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/focusflow}
    username: ${SPRING_DATASOURCE_USERNAME:focusflow}
    password: ${SPRING_DATASOURCE_PASSWORD:focusflow}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

focusflow:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    connect-timeout: 2s
    read-timeout: 30s
    max-attempts: 1
    retry-delay: 0s
    max-retry-after: 5s
